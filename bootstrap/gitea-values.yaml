postgresql:
  enabled: false
postgresql-ha:
  enabled: false
redis-cluster:
  enabled: false
valkey-cluster:
  enabled: false
memcached:
  enabled: false

gitea:
  admin:
    username: gitea-admin
    password: "changeme-set-a-real-one-before-install"   # rotate immediately after first login
    email: "admin@homelab.local"
  config:
    database:
      DB_TYPE: sqlite3
    session:
      PROVIDER: memory
    cache:
      ADAPTER: memory
    queue:
      TYPE: level
    server:
      OFFLINE_MODE: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi

persistence:
  enabled: true
  size: 2Gi

service:
  http:
    type: ClusterIP
    port: 3000
  ssh:
    type: ClusterIP
